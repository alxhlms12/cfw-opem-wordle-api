<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f4">
  <meta name="description" content="Speedle — a configurable, dictionary-driven word game.">
  <title>Speedle</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">speedle<span>.</span></a>
  <div class="header-actions">
    <button id="dailyGame" class="button secondary">Daily</button>
    <button id="newGame" class="button primary">New game</button>
    <button id="settingsOpen" class="icon-button" aria-label="Settings" title="Settings">⚙</button>
  </div>
</header>
<main class="shell">
  <section class="game" aria-label="Word game">
    <p id="remaining" class="game-meta">Guess the 5-letter word</p>
    <div id="board" class="board"></div>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div id="keyboard" class="keyboard"></div>
  </section>
</main>
<dialog id="settingsDialog" class="settings-dialog">
  <aside id="settings" class="panel">
    <div class="panel-title"><div><p class="eyebrow">SPEEDLE</p><h2>Settings</h2></div><button id="settingsClose" class="icon-button" aria-label="Close settings">×</button></div>
    <label>API base URL<input id="apiBase" value="/api/v1" spellcheck="false"></label>
    <label>Dictionary<select id="dictionary"><option>Loading…</option></select></label>
    <p id="dictionaryInfo" class="help">Dictionary metadata appears here.</p>
    <div class="field-grid">
      <label>Mode<select id="mode"><option value="unlimited">Unlimited</option><option value="daily">Daily</option></select></label>
      <label>Answer pool<select id="answerPolicy"><option value="curated">Curated answers</option><option value="all-valid">All accepted words</option></select></label>
    </div>
    <label>Word length <output id="lengthValue">5</output><input id="length" type="range" min="2" max="15" value="5"></label>
    <label>Maximum attempts <output id="attemptsValue">6</output><input id="attempts" type="range" min="1" max="20" value="6"></label>
    <div class="field-grid">
      <label>Token lifetime<select id="ttl"><option value="1">1 hour</option><option value="6">6 hours</option><option value="24" selected>24 hours</option><option value="72">3 days</option><option value="168">7 days</option></select></label>
      <label>Profanity filter<select id="profanity"><option value="strict">Strict</option><option value="off">Off</option></select></label>
    </div>
    <label class="check"><input id="hardMode" type="checkbox"> Hard mode</label>
    <div class="divider"></div>
    <p class="eyebrow">DISPLAY</p>
    <label class="check"><input id="keyboardEnabled" type="checkbox" checked> On-screen keyboard</label>
    <label class="check"><input id="colorFeedback" type="checkbox" checked> Color feedback</label>
    <label class="check"><input id="highContrast" type="checkbox"> High contrast</label>
    <label class="check"><input id="tileLabels" type="checkbox"> Show result labels</label>
    <div class="divider"></div>
    <p class="eyebrow">DICTIONARY TOOLS</p>
    <label>Word<input id="utilityWord" placeholder="Enter a word"></label>
    <div class="field-grid">
      <button id="validateWord" class="button secondary">Validate</button>
      <button id="randomWord" class="button secondary">Random word</button>
    </div>
    <button id="resume" class="button secondary full">Resume saved game</button>
    <button id="health" class="button secondary full">Check API health</button>
    <button id="refresh" class="button secondary full">Refresh dictionaries</button>
    <pre id="apiOutput" class="api-output" hidden></pre>
    <p class="footnote">Games use encrypted stateless tokens. The latest token is saved in this browser for resume.</p>
  </aside>
</dialog>
<script src="/app.js"></script>
</body>
</html>
